# nav2_wrapper_rbnx — deployment target: jetson-native.
# Same package + capabilities + config as the default package_manifest.yaml
# (see it for the full config schema). Only build/start differ:
#   build → RBNX_BUILD_TARGET=jetson-native (see scripts/build.sh)
#   start → ROBONIX_NAV2_FORCE=native (see scripts/start.sh)
# Select from a deploy entry's `manifest:` field.
manifestVersion: 1

package:
  name: com.robonix.service.nav2
  version: 0.1.0
  vendor: robonix
  description: Nav2 service wrapper (jetson-native target).
  license: Apache-2.0

capability_id: nav2

build: RBNX_BUILD_TARGET=jetson-native bash scripts/build.sh
start: ROBONIX_NAV2_FORCE=native bash scripts/start.sh

stop: ROBONIX_NAV2_FORCE=native bash scripts/stop.sh

capabilities:
  - name: robonix/service/navigation/driver
    transport: grpc
  - name: robonix/service/navigation/navigate
    transport: [mcp, grpc]
  - name: robonix/service/navigation/navigate/status
    transport: [mcp, grpc]
  - name: robonix/service/navigation/navigate/cancel
    transport: [mcp, grpc]
  - name: robonix/service/navigation/adjust_speed
    transport: [mcp, grpc]
  - name: robonix/service/navigation/set_speed_limit
    transport: [mcp, grpc]
  - name: robonix/service/navigation/get_speed_limit
    transport: [mcp, grpc]
  - name: robonix/service/navigation/costmap
    transport: ros2
